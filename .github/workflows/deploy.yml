name: Deploy R Shinylive to GitHub Pages

on:
  push:
    branches:
      - main  # あなたのメインブランチ名に合わせてください（masterの場合はmasterにする）

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages:
            any::shiny
            any::shinylive
            any::jsonlite
            any::echarts4r
            # 💡 他にCRANの外部パッケージ（ggplot2等）を使っている場合は、ここに「any::ggplot2」のように追記します

      - name: Build Shinylive export
        run:
          Rscript -e 'shinylive::export("app_lite", "docs")'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
